# Open-ended optimization task: pack 32 circles in the unit square around a keep-out zone to reach a target sum of radii.
schema_version = "1.3"
artifacts = []

[task]
name = "cs329z/circle-packing-keepout"
description = "Find a packing of 32 non-overlapping circles in the unit square, avoiding a circular keep-out zone, whose radii sum to at least 2.80."
authors = [{ name = "Ifdita" }]
keywords = ["optimization", "search", "circle-packing", "layout", "python"]

[metadata]
difficulty = "hard"
category = "optimization"

[verifier]
timeout_sec = 60.0
collect = []

[verifier.env]

[agent]
timeout_sec = 900.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
